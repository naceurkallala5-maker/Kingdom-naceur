<title>مكتب مملكة ناصر</title>

<style>
/* Layout: a royal-blue masthead, then a working office: attention first, the team grid, then tasks, reports and the log. */
:root {
  --bg: #f4f7fc;
  --surface: #ffffff;
  --surface-2: #eaf1fb;
  --fg: #172033;
  --muted: #5a6880;
  --line: #dbe4f1;
  --royal: #1d3a8a;
  --royal-ink: #ffffff;
  --sky: #d7e6fa;
  --sky-ink: #183170;
  --gold: #9a6d12;
  --gold-bg: #fbf2de;
  --red: #a63d3d;
  --red-bg: #f9e7e7;
  --green: #2c7a55;
  --font-display: "Amiri", "Traditional Arabic", serif;
  --font-body: "IBM Plex Sans Arabic", "Noto Sans Arabic", Tahoma, sans-serif;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1526; --surface: #151f35; --surface-2: #1b2842; --fg: #e6ecf7; --muted: #9aa9c2;
    --line: #26355a; --royal: #3d63c9; --royal-ink: #ffffff; --sky: #22355e; --sky-ink: #cfe0fb;
    --gold: #e0b55a; --gold-bg: #33290f; --red: #e38a8a; --red-bg: #3a1c1f; --green: #6fd0a0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1526; --surface: #151f35; --surface-2: #1b2842; --fg: #e6ecf7; --muted: #9aa9c2;
  --line: #26355a; --royal: #3d63c9; --royal-ink: #ffffff; --sky: #22355e; --sky-ink: #cfe0fb;
  --gold: #e0b55a; --gold-bg: #33290f; --red: #e38a8a; --red-bg: #3a1c1f; --green: #6fd0a0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.75; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.mast { background: var(--royal); color: var(--royal-ink); }
header.mast .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; padding-block: 14px; }
.brand h1 { margin: 0; font-family: var(--font-display); font-size: 1.9rem; line-height: 1.2; }
.brand p { margin: 0; font-size: .85rem; opacity: .85; }
nav.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
nav.tabs button { font: inherit; color: inherit; background: transparent; border: 1px solid rgba(255,255,255,.35); border-radius: 999px; padding: 4px 14px; cursor: pointer; }
nav.tabs button[aria-selected="true"] { background: #fff; color: #1d3a8a; }
.conn { margin-inline-start: auto; font-size: .82rem; opacity: .9; }
main { padding-block: 20px 48px; display: grid; gap: 18px; }
section.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; min-width: 0; }
section.panel > h2 { margin: 0 0 12px; font-size: 1.08rem; color: var(--fg); display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.view[hidden] { display: none !important; }
.muted { color: var(--muted); }
.meta { color: var(--muted); font-size: .84rem; margin: 2px 0; }
.chip { display: inline-block; background: var(--sky); color: var(--sky-ink); border-radius: 999px; padding: 1px 10px; font-size: .78rem; white-space: nowrap; }
.attention { border-inline-start: 4px solid var(--gold); }
.att-item { background: var(--gold-bg); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; }
.att-list { display: grid; gap: 10px; }
.att-item h3 { margin: 0; font-size: .98rem; }
.att-item p { margin: 0; white-space: pre-wrap; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
button.btn { font: inherit; border-radius: 8px; padding: 5px 14px; cursor: pointer; border: 1px solid var(--royal); background: var(--royal); color: var(--royal-ink); }
button.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
button.btn.danger { background: transparent; color: var(--red); border-color: var(--red); }
button.btn:disabled { opacity: .55; cursor: default; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--royal); outline-offset: 2px; }
input.text, textarea { width: 100%; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
.team { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.emp { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; border-top: 4px solid var(--line); background: var(--surface); min-width: 0; }
.emp h3 { margin: 0; font-size: 1rem; }
.emp .role { margin: 2px 0; font-weight: 600; color: var(--sky-ink); }
.emp-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.badge { font-size: .76rem; font-weight: 600; border-radius: 999px; padding: 1px 9px; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.st-working { --st: var(--royal); } .st-researching { --st: #4f7fd6; } .st-meeting { --st: #7aa3e6; }
.st-waiting_owner { --st: var(--gold); } .st-blocked { --st: var(--red); } .st-idle { --st: var(--line); }
.emp[class*="st-"] { border-top-color: var(--st); }
.badge.st-working { background: var(--royal); color: var(--royal-ink); }
.badge.st-researching, .badge.st-meeting { background: var(--sky); color: var(--sky-ink); }
.badge.st-waiting_owner { background: var(--gold-bg); color: var(--gold); }
.badge.st-blocked { background: var(--red-bg); color: var(--red); }
.cols { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.list { display: grid; gap: 0; }
.item { border-bottom: 1px solid var(--line); padding: 8px 0; min-width: 0; }
.item:last-child { border-bottom: 0; }
.item h3 { margin: 0; font-size: .95rem; }
.item-head { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.log { list-style: none; margin: 0; padding: 0; max-height: 420px; overflow-y: auto; }
.log li { padding: 6px 0; border-bottom: 1px solid var(--line); display: grid; }
.log .t { font-size: .76rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.chat-box { display: grid; gap: 10px; max-height: 58vh; overflow-y: auto; padding: 4px; }
.msg { max-width: 82%; border-radius: 12px; padding: 8px 12px; white-space: pre-wrap; min-width: 0; overflow-wrap: anywhere; }
.msg.owner { background: var(--royal); color: var(--royal-ink); justify-self: start; }
.msg.executive { background: var(--surface-2); justify-self: end; }
.msg .who { display: block; font-size: .75rem; opacity: .8; }
.compose { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr) auto; align-items: end; margin-top: 10px; }
.note { font-size: .86rem; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); }
.note.err { background: var(--red-bg); color: var(--red); }
.report { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; }
.report dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; }
.report dt { color: var(--muted); font-size: .85rem; }
.report dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.reports { display: grid; gap: 12px; }
.help li { margin-bottom: 6px; }
.steps { padding-inline-start: 20px; margin: 6px 0; }
.steps li { margin-bottom: 4px; }
.runner { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
@media (max-width: 820px) { .cols { grid-template-columns: minmax(0, 1fr); } .conn { margin-inline-start: 0; } .msg { max-width: 96%; } .compose { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<header class="mast">
  <div class="wrap">
    <div class="brand"><h1 data-t="app.name"></h1><p data-t="app.tagline"></p></div>
    <nav class="tabs" id="tabs">
      <button data-view="board" aria-selected="true" data-t="nav.board"></button>
      <button data-view="chat" aria-selected="false" data-t="nav.chat"></button>
      <button data-view="reports" aria-selected="false" data-t="nav.reports"></button>
      <button data-view="instagram" aria-selected="false" data-t="nav.instagram"></button>
      <button data-view="help" aria-selected="false" data-t="nav.help"></button>
    </nav>
    <span class="conn" id="conn"></span>
  </div>
</header>

<main class="wrap">
  <p class="note err" id="global-note" hidden></p>

  <div class="view" id="view-board">
    <section class="panel attention"><h2 data-t="board.attention"></h2><div class="att-list" id="attention"></div></section>
    <section class="panel">
      <h2><span data-t="board.team"></span><span class="runner"><span class="meta" id="runner-state"></span><button class="btn ghost" id="runner-stop" hidden data-t="runner.stop"></button></span></h2>
      <div class="team" id="team"></div>
    </section>
    <div class="cols">
      <section class="panel"><h2 data-t="board.tasks"></h2><div class="list" id="tasks"></div></section>
      <section class="panel"><h2 data-t="board.log"></h2><ol class="log" id="log"></ol></section>
    </div>
  </div>

  <div class="view" id="view-chat" hidden>
    <section class="panel">
      <h2 data-t="chat.title"></h2>
      <p class="muted" data-t="chat.intro"></p>
      <div class="chat-box" id="chat"></div>
      <p class="note" id="chat-note" hidden></p>
      <form class="compose" id="compose">
        <textarea id="chat-input" rows="3"></textarea>
        <div class="row"><button class="btn" id="chat-send" type="submit" data-t="chat.send"></button><button class="btn ghost" id="chat-stop" type="button" hidden data-t="runner.stop"></button></div>
      </form>
    </section>
  </div>

  <div class="view" id="view-reports" hidden>
    <section class="panel">
      <h2><span data-t="reports.title"></span><span class="row"><button class="btn" id="btn-daily" data-t="reports.daily"></button><button class="btn ghost" id="btn-weekly" data-t="reports.weekly"></button></span></h2>
      <p class="note" id="reports-note" hidden></p>
      <div class="reports" id="reports"></div>
    </section>
  </div>

  <div class="view" id="view-instagram" hidden>
    <section class="panel">
      <h2><span data-t="ig.title"></span><span class="chip" data-t="ig.disconnected"></span></h2>
      <p data-t="ig.intro"></p>
      <h3 data-t="ig.stepsTitle"></h3>
      <ol class="steps" id="ig-steps"></ol>
      <p class="muted" data-t="ig.note"></p>
    </section>
  </div>

  <div class="view" id="view-help" hidden>
    <section class="panel"><h2 data-t="help.title"></h2><ul class="help" id="help"></ul></section>
  </div>
</main>

<script>
(() => {
  const AR = JSON.parse(document.getElementById('ar-strings').textContent);
  const get = (k) => k.split('.').reduce((o, p) => (o == null ? undefined : o[p]), AR);
  const t = (k, v = {}) => { const s = get(k); return typeof s === 'string' ? s.replace(/\{(\w+)\}/g, (_, n) => (v[n] ?? '')) : get('err.generic'); };
  const fmt = new Intl.DateTimeFormat('ar-u-nu-latn', { timeZone: 'Europe/Paris', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });

  // ---------- derived status (only from recorded data) ----------
  function statusOf(empId) {
    const open = S.sessions.find((s) => s.employeeId === empId && !s.endedAt);
    if (open) return { status: open.status, taskId: open.taskId, since: open.updatedAt || open.startedAt };
    const pend = S.approvals.find((a) => a.employeeId === empId && a.status === 'pending');
    if (pend) return { status: 'waiting_owner', taskId: pend.taskId, since: pend.at };
    return { status: 'idle', taskId: null, since: null };
  }
  const emp = (id) => S.employees.find((e) => e.id === id);
  const taskById = (id) => S.tasks.find((x) => x.id === id);

  // ---------- rendering ----------
  function render() {
    renderAttention(); renderTeam(); renderTasks(); renderLog(); renderChat(); renderReports();
  }
  function renderAttention() {

      const e = emp(a.employeeId);
      const note = el('input', { cls: 'text', attrs: { type: 'text', id: 'note-' + a.id, placeholder: t('board.notePh') } });

      return el('article', { cls: 'att-item' }, [
        el('div', { cls: 'row' }, [el('span', { cls: 'chip', text: t('kind.' + a.kind) }), el('h3', { text: a.title })]),
        el('p', { text: a.details }),
        el('p', { cls: 'meta', text: [t('board.requestedBy') + ': ' + (e ? e.name : ''), t('board.waiting') + ' ' + when(a.at)].join(' · ') }),

        el('div', { cls: 'row' }, [btn('board.approve', 'approved', ''), btn('board.changes', 'changes_requested', 'ghost'), btn('board.reject', 'rejected', 'danger')])

  }

  // ---------- writes ----------
  function col(name) { return db.collection(name); }
  async function logEvent(ev) { await col('events').add({ ...ev, at: nowIso() }); }
  async function decide(a, decision, note) {
    try {
      if (note && LATIN.test(note)) { flash(t('err.non_arabic')); return; }
      await col('approvals').doc(a.id).update({ status: decision, ownerNote: note || '', decidedAt: nowIso() });
      if (a.taskId) {
        const others = S.approvals.filter((x) => x.taskId === a.taskId && x.status === 'pending' && x.id !== a.id);
        if (!others.length) await col('tasks').doc(a.taskId).update({ status: decision === 'rejected' ? 'rejected' : 'done', updatedAt: nowIso() });
      }
      await logEvent({ type: 'approval_decided', employeeId: a.employeeId, taskId: a.taskId || null, status: decision, label: a.title });
    } catch { flash(t('err.db')); }
  }
  function flash(msg) { const n = $('global-note'); n.textContent = msg; n.hidden = false; setTimeout(() => { n.hidden = true; }, 7000); }
  async function createTask({ employeeId, title, objective, afterTaskId }) {
    const ref = await col('tasks').add({ employeeId, title, objective, afterTaskId: afterTaskId || null, status: 'assigned', createdAt: nowIso(), updatedAt: nowIso() });
    await logEvent({ type: 'task_created', employeeId, taskId: ref.id, label: title });
    return ref.id;
  }
  async function raiseDecision({ kind, title, details, employeeId, taskId }) {
    const ref = await col('approvals').add({ kind, title, details, employeeId, taskId: taskId || null, status: 'pending', at: nowIso() });
    await logEvent({ type: 'approval_requested', employeeId, taskId: taskId || null, label: title });
    return ref.id;
  }
  async function startSession(employeeId, taskId, status, label, type = 'session_started') {
    const ref = await col('sessions').add({ employeeId, taskId: taskId || null, status, startedAt: nowIso(), updatedAt: nowIso(), endedAt: null, open: true });
    await logEvent({ type, employeeId, taskId: taskId || null, status, label: label || '' });
    return ref.id;
  }
  async function endSession(sessionId, employeeId, taskId, label) {
    await col('sessions').doc(sessionId).update({ endedAt: nowIso(), updatedAt: nowIso(), open: false });
    await logEvent({ type: 'session_ended', employeeId, taskId: taskId || null, label: label || '' });
  }

  // ---------- Claude calls (viewer's own account, no extra charge) ----------
  function errText(e) { const c = e && e.code; return get('err.' + c) ? t('err.' + c) : t('err.generic'); }
  function hasLatin(v) { if (typeof v === 'string') return LATIN.test(v); if (Array.isArray(v)) return v.some(hasLatin); if (v && typeof v === 'object') return Object.entries(v).some(([k, x]) => k !== 'kind' && k !== 'status' && hasLatin(x)); return false; }

  function companyState() {
    const roster = S.employees.map((e) => `${e.id}. ${e.name}: ${e.title} (${e.department})`).join('\n');
    const open = S.tasks.filter((x) => !['done', 'rejected'].includes(x.status)).slice(0, 15).map((x) => `- [${x.id}] ${x.title} | ${emp(x.employeeId)?.name || ''} | ${t('taskStatus.' + x.status)}`).join('\n') || 'لا يوجد';
    const pend = S.approvals.filter((a) => a.status === 'pending').map((a) => `- ${a.title}`).join('\n') || 'لا يوجد';
    const recent = S.reports.slice(0, 6).map((r) => `- ${r.title}: ${(r.work || r.body || '').slice(0, 300)}`).join('\n') || 'لا يوجد';
    return `سجل الموظفين:\n${roster}\n\nالمهام المفتوحة:\n${open}\n\nقرارات تنتظر المالك:\n${pend}\n\nأحدث التقارير:\n${recent}`;
  }

  let execCtl = null;
  async function sendToExecutive(text) {
    const note = $('chat-note'); note.hidden = true; note.className = 'note';
    const send = $('chat-send'), stop = $('chat-stop');
    await col('messages').add({ role: 'owner', content: text, at: nowIso() });
    if (!sample) { note.textContent = t('err.unavailable'); note.className = 'note err'; note.hidden = false; return; }
    const lim = await sample.limits().catch(() => null);
    if (lim && !lim.tools) { note.textContent = t('err.tools_unavailable'); note.className = 'note err'; note.hidden = false; return; }
    send.disabled = true; stop.hidden = false; note.textContent = t('chat.thinking'); note.hidden = false;
    const newTasks = [];
    const tools = [
      { name: 'assign_task', description: 'Record a real task for one employee. Returns the new task id. Use after_task_id to make it wait for another task. Title/objective in Arabic only.',
        inputSchema: { type: 'object', properties: { employee_id: { type: 'integer' }, title: { type: 'string' }, objective: { type: 'string' }, after_task_id: { type: 'string' } }, required: ['employee_id', 'title', 'objective'] },
        execute: async (i) => {
          const employeeId = Number(i.employee_id); if (!emp(employeeId) || employeeId === 1) throw new Error('رقم موظف غير صالح');
          const title = String(i.title || ''), objective = String(i.objective || '');
          if (!title || hasLatin(title) || hasLatin(objective)) throw new Error('العنوان والهدف يجب أن يكونا بالعربية فقط');
          const after = i.after_task_id ? String(i.after_task_id) : null;
          const id = await createTask({ employeeId, title, objective, afterTaskId: after });
          newTasks.push(id); return { task_id: id };
        } },
      { name: 'request_owner_decision', description: 'Put a decision, approval or missing input in the owner NEEDS YOUR ATTENTION list. kind: publish|message|spend|settings|connect|sharia_review|decision|missing_info. Arabic only.',
        inputSchema: { type: 'object', properties: { kind: { type: 'string' }, title: { type: 'string' }, details: { type: 'string' } }, required: ['kind', 'title', 'details'] },
        execute: async (i) => {
          const kind = get('kind.' + i.kind) ? String(i.kind) : 'decision';
          if (hasLatin(i.title) || hasLatin(i.details)) throw new Error('النص يجب أن يكون بالعربية فقط');
          const id = await raiseDecision({ kind, title: String(i.title), details: String(i.details), employeeId: 1 }); return { request_id: id };
        } }
    ];
    const history = S.messages.slice(-12).map((m) => ({ role: m.role === 'owner' ? 'user' : 'assistant', content: m.content }));
    if (!history.length || history[history.length - 1].content !== text) history.push({ role: 'user', content: text });
    while (history.length && history[0].role !== 'user') history.shift();
    const turns = [{ role: 'user', content: EXEC_RULES + '\n\nحالة الشركة الآن:\n' + companyState() }, ...history];
    let reply = '';
    try {
      for (let attempt = 0; attempt < 2; attempt++) {
        execCtl = new AbortController();
        const res = await sample(turns, { tools, modelTier: 'complex', signal: execCtl.signal, onText: ({ text: x }) => { note.textContent = x; } });
        reply = res.text.trim();
        if (!LATIN.test(reply)) break;
        if (attempt === 1) throw { code: 'non_arabic' };
        turns.push({ role: 'assistant', content: reply }, { role: 'user', content: 'أعد كتابة ردك بالعربية الفصحى فقط دون أي حرف لاتيني.' });
      }
      await col('messages').add({ role: 'executive', content: reply, at: nowIso() });
      note.hidden = true;
      queue.push(...newTasks); pump();
    } catch (e) {
      if (e && e.code === 'cancelled') { note.hidden = true; } else { note.textContent = errText(e); note.className = 'note err'; note.hidden = false; }
      if (newTasks.length) { queue.push(...newTasks); pump(); }
    } finally { send.disabled = false; stop.hidden = true; execCtl = null; }
  }

  // ---------- employee runner: one task at a time, real sessions ----------
  const queue = []; let running = null; let runCtl = null;
  const RESEARCH_DEPTS = [2, 3, 4];
  async function waitFor(pred, ms = 8000) { const t0 = Date.now(); while (!pred() && Date.now() - t0 < ms) await new Promise((r) => setTimeout(r, 200)); }
  async function pump() {
    if (running || !queue.length) return renderRunner();
    // pick the first queued task whose prerequisite is done
    await waitFor(() => queue.every((id) => taskById(id)));
    const idx = queue.findIndex((id) => { const x = taskById(id); if (!x) return false; const dep = x.afterTaskId && taskById(x.afterTaskId); return !dep || dep.status === 'done'; });
    if (idx === -1) { renderRunner(); return; }
    const id = queue.splice(idx, 1)[0];
    running = id; renderRunner(); render();
    try { await runTask(id); } finally { running = null; renderRunner(); render(); pump(); }
  }
  function renderRunner() {
    const s = $('runner-state'), stop = $('runner-stop');
    if (running) { const x = taskById(running); s.textContent = [t('runner.running', { name: emp(x?.employeeId)?.name || '' }), queue.length && t('runner.queue', { n: queue.length })].filter(Boolean).join(' · '); stop.hidden = false; }
    else { s.textContent = ''; stop.hidden = true; }
  }
  $('runner-stop').onclick = () => { queue.length = 0; runCtl?.abort(); flash(t('runner.stopped')); };
  $('chat-stop').onclick = () => execCtl?.abort();

  async function runTask(taskId) {
    const x = taskById(taskId); if (!x) return;
    const e = emp(x.employeeId); if (!e) return;
    if (!sample) { flash(t('err.unavailable')); return; }
    const status = RESEARCH_DEPTS.includes(e.id) ? 'researching' : 'working';
    await col('tasks').doc(taskId).update({ status: 'in_progress', updatedAt: nowIso() });
    const sid = await startSession(e.id, taskId, status, x.title);
    const dep = x.afterTaskId ? S.reports.find((r) => r.taskId === x.afterTaskId) : null;
    const prompt = `أنت ${e.name}، ${ROLE[e.id]} في شركة مملكة ناصر لإنتاج المحتوى الإسلامي على إنستغرام.
قواعد ملزمة:
- ${RULES_COMMON}

المهمة: ${x.title}
الهدف: ${x.objective}
${dep ? `\nناتج المرحلة السابقة (من ${emp(dep.employeeId)?.name || ''}):\n${String(dep.deliverable || '').slice(0, 6000)}\n` : ''}
نفّذ المهمة فعلاً وقدّم ناتجاً كاملاً قابلاً للاستخدام، ثم أجب بكائن واحد فقط بهذا الشكل (المفاتيح كما هي، والقيم كلها بالعربية):
{"work":"ملخص ما أنجزته","deliverable":"الناتج الكامل نفسه","sources":[{"item":"المادة","reference":"المصدر أو الموضع","status":"مقبولة|تحتاج تحققاً من المصدر|مرفوضة"}],"problems":"العوائق أو لا يوجد","decisions":[{"kind":"sharia_review|decision|missing_info|publish","title":"عنوان القرار","details":"التفاصيل والخيارات"}],"next":"الخطوة التالية الموصى بها","status":"done|waiting_owner|blocked"}`;
    try {
      let out = null;
      for (let attempt = 0; attempt < 2; attempt++) {
        runCtl = new AbortController();
        out = await sample.json(attempt ? prompt + '\n\nتنبيه: الرد السابق احتوى حروفاً لاتينية. اكتب كل القيم بالعربية فقط.' : prompt, { modelTier: TIER[e.modelTier] || 'default', cache: false, signal: runCtl.signal });
        if (out && typeof out === 'object' && !hasLatin({ work: out.work, deliverable: out.deliverable, sources: out.sources, problems: out.problems, decisions: out.decisions, next: out.next })) break;
        if (attempt === 1) throw { code: 'non_arabic' };
      }
      const decisions = Array.isArray(out.decisions) ? out.decisions.filter((d) => d && d.title) : [];
      const finalStatus = ['done', 'waiting_owner', 'blocked'].includes(out.status) ? out.status : 'done';
      const effective = decisions.length && finalStatus === 'done' ? 'waiting_owner' : finalStatus;
      await col('reports').add({
        kind: 'task', taskId, employeeId: e.id, title: x.title, objective: x.objective,
        work: String(out.work || ''), deliverable: String(out.deliverable || ''), sources: Array.isArray(out.sources) ? out.sources.slice(0, 30) : [],
        problems: String(out.problems || ''), decisions, next: String(out.next || ''), status: effective, at: nowIso()
      });
      await logEvent({ type: 'report_saved', employeeId: e.id, taskId, label: x.title });
      for (const d of decisions) await raiseDecision({ kind: get('kind.' + d.kind) ? d.kind : 'decision', title: String(d.title), details: String(d.details || ''), employeeId: e.id, taskId });
      await col('tasks').doc(taskId).update({ status: effective === 'waiting_owner' && !decisions.length ? 'done' : effective, updatedAt: nowIso() });
    } catch (err) {
      await col('tasks').doc(taskId).update({ status: err && err.code === 'cancelled' ? 'assigned' : 'failed', updatedAt: nowIso() }).catch(() => {});
      if (!(err && err.code === 'cancelled')) { await logEvent({ type: 'task_failed', employeeId: e.id, taskId, label: x.title }).catch(() => {}); flash(errText(err)); }
    } finally {
      await endSession(sid, e.id, taskId, x.title).catch(() => {});
      runCtl = null;
    }
  }

  // ---------- briefings ----------
  async function briefing(kind) {
    const note = $('reports-note');
    if (!sample) { note.textContent = t('err.unavailable'); note.className = 'note err'; note.hidden = false; return; }
    const daily = kind === 'daily';
    ['btn-daily', 'btn-weekly'].forEach((b) => { $(b).disabled = true; });
    note.className = 'note'; note.textContent = t('reports.preparing'); note.hidden = false;
    const label = daily ? t('reports.kindDaily') : t('reports.kindWeekly');
    const sid = await startSession(1, null, daily ? 'working' : 'meeting', label, daily ? 'session_started' : 'meeting_started');
    const ask = daily
      ? 'أعدّ الإحاطة اليومية للمالك: ما عليه فعله اليوم، والقرارات التي تنتظره، وأهم أولويات الشركة اليوم، وما أُنجز مؤخراً. صفحة واحدة مختصرة.'
      : 'أعدّ تقرير المراجعة الأسبوعية بناءً على المهام والتقارير: ما الذي لم يسر كما خُطط له هذا الأسبوع؟ لماذا حدث ذلك؟ كيف سنعالجه؟ ما الذي يجب أن يتغيّر الأسبوع القادم؟ ما القرارات المطلوبة من المالك؟ اعتمد على المسجّل فقط ولا تختلق.';
    try {
      let text = '';
      for (let attempt = 0; attempt < 2; attempt++) {
        const res = await sample(EXEC_RULES + '\n\nحالة الشركة الآن:\n' + companyState() + '\n\nالمطلوب:\n' + ask + (attempt ? '\nاكتب بالعربية فقط دون أي حرف لاتيني.' : ''), { modelTier: 'complex', cache: false, onText: ({ text: x }) => { note.textContent = x; } });
        text = res.text.trim(); if (!LATIN.test(text)) break; if (attempt === 1) throw { code: 'non_arabic' };
      }
      const title = (daily ? t('reports.kindDaily') : t('reports.kindWeekly')) + ' · ' + when(nowIso());
      await col('reports').add({ kind, employeeId: 1, title, body: text, at: nowIso(), scheduled: false });
      await logEvent({ type: 'briefing_saved', employeeId: 1, label: title });
      note.hidden = true;
    } catch (e) { note.textContent = errText(e); note.className = 'note err'; note.hidden = false; }
    finally { await endSession(sid, 1, null, label).catch(() => {}); ['btn-daily', 'btn-weekly'].forEach((b) => { $(b).disabled = false; }); }
  }
  $('btn-daily').onclick = () => briefing('daily');
  $('btn-weekly').onclick = () => briefing('weekly');

  $('compose').addEventListener('submit', (e) => {
    e.preventDefault();
    const v = $('chat-input').value.trim();
    if (!v) { const n = $('chat-note'); n.textContent = t('err.empty'); n.className = 'note err'; n.hidden = false; return; }
    if (!db) return;
    $('chat-input').value = '';
    sendToExecutive(v);
  });

  // ---------- boot ----------
  function subscribe(name, query, map) {
    return query.onSnapshot((snap) => { S[name] = snap.docs.map((d) => map({ id: d.id, ...d.data() })); loaded(); render(); }, () => {});
  }
  let firstData = false; const slowTimer = setTimeout(() => { if (!firstData) $('conn').textContent = t('conn.slow'); }, 10000);
  function loaded() { if (!firstData) { firstData = true; clearTimeout(slowTimer); $('conn').textContent = t('conn.live'); } }
  render();
  (async () => {
    if (!window.claude) { $('conn').textContent = t('conn.unavailable'); return; }
    [db, sample] = await Promise.all([claude.use('db'), claude.use('sample')]);
    if (!db) { $('conn').textContent = t('conn.unavailable'); return; }
    const id = (o) => o;
    subscribe('employees', db.collection('employees').orderBy('id'), (o) => ({ ...o, id: Number(o.id) }));
    subscribe('sessions', db.collection('sessions').where('open', '==', true), id);
    subscribe('tasks', db.collection('tasks').orderBy('updatedAt', 'desc').limit(60), id);
    subscribe('approvals', db.collection('approvals').where('status', '==', 'pending'), id);
    subscribe('events', db.collection('events').orderBy('at', 'desc').limit(60), id);
    db.collection('messages').orderBy('at', 'desc').limit(60).onSnapshot((snap) => { S.messages = snap.docs.map((d) => ({ id: d.id, ...d.data() })).reverse(); loaded(); render(); }, () => {});
    subscribe('reports', db.collection('reports').orderBy('at', 'desc').limit(40), id);
  })();
})();
</script>
