<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Aref+Ruqaa:wght@700&family=Reem+Kufi:wght@600;700&display=swap">
<style>
html,body{margin:0;padding:0;background:#000}
.c{width:1080px;height:1080px;position:relative;overflow:hidden}
svg{position:absolute;inset:0}
.t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center}
</style></head><body>
<div class="c" id="v1">
 <svg viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
   <radialGradient id="g1" cx="50%" cy="42%" r="70%"><stop offset="0" stop-color="#2c55c2"/><stop offset=".55" stop-color="#1d3a8a"/><stop offset="1" stop-color="#0f2259"/></radialGradient>
   <pattern id="p1" width="120" height="120" patternUnits="userSpaceOnUse">
    <g fill="none" stroke="#a9c6f2" stroke-opacity=".10" stroke-width="2">
     <rect x="35" y="35" width="50" height="50"/><rect x="35" y="35" width="50" height="50" transform="rotate(45 60 60)"/>
    </g>
   </pattern>
  </defs>
  <rect width="1080" height="1080" fill="url(#g1)"/>
  <rect width="1080" height="1080" fill="url(#p1)"/>
  <g transform="translate(540 540)" fill="none">
   <g stroke="#ffffff" stroke-width="10" stroke-linejoin="round">
    <rect x="-300" y="-300" width="600" height="600"/>
    <rect x="-300" y="-300" width="600" height="600" transform="rotate(45)"/>
   </g>
   <g stroke="#a9c6f2" stroke-width="3" stroke-linejoin="round" opacity=".9">
    <rect x="-268" y="-268" width="536" height="536"/>
    <rect x="-268" y="-268" width="536" height="536" transform="rotate(45)"/>
   </g>
   <circle r="250" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".35" stroke-width="2"/>
  </g>
 </svg>
 <div class="t">
  <div style="font-family:'Amiri';font-size:96px;color:#d7e6fa;line-height:1;margin-bottom:0">مملكة</div>
  <div style="font-family:'Aref Ruqaa';font-size:250px;line-height:1.05;margin-top:-6px;text-shadow:0 6px 24px rgba(8,20,60,.45)">ناصر</div>
 </div>
</div>

<div class="c" id="v2">
 <svg viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a50b8"/><stop offset="1" stop-color="#142a63"/></linearGradient></defs>
  <rect width="1080" height="1080" fill="#f4f8ff"/>
  <path d="M290 900 V520 Q290 300 540 190 Q790 300 790 520 V900 Z" fill="url(#g2)"/>
  <path d="M325 900 V528 Q325 330 540 232 Q755 330 755 528 V900" fill="none" stroke="#a9c6f2" stroke-width="4"/>
  <g transform="translate(540 330)">
   <circle r="44" fill="#ffffff"/><circle cx="18" cy="-8" r="38" fill="#2449a6"/>
  </g>
  <rect x="250" y="900" width="580" height="14" rx="7" fill="#1d3a8a"/>
 </svg>
 <div class="t" style="padding-top:170px">
  <div style="font-family:'Amiri';font-size:66px;color:#d7e6fa;line-height:1">مملكة</div>
  <div style="font-family:'Amiri';font-size:150px;line-height:1.15">ناصر</div>
 </div>
</div>

<div class="c" id="v3">
 <svg viewBox="0 0 1080 1080" width="1080" height="1080">
  <rect width="1080" height="1080" fill="#1d3a8a"/>
  <g transform="translate(540 540)" fill="none" stroke="#ffffff">
   <circle r="440" stroke-opacity=".25" stroke-width="2"/>
   <circle r="410" stroke-width="6"/>
   <circle r="390" stroke="#a9c6f2" stroke-width="2"/>
  </g>
  <g transform="translate(540 330)">
   <g fill="#a9c6f2"><rect x="-46" y="-46" width="92" height="92"/><rect x="-46" y="-46" width="92" height="92" transform="rotate(45)"/></g>
   <circle r="24" fill="#1d3a8a"/>
  </g>
 </svg>
 <div class="t" style="padding-top:120px">
  <div style="font-family:'Reem Kufi';font-weight:600;font-size:70px;color:#d7e6fa;line-height:1;margin-bottom:18px">مملكة</div>
  <div style="font-family:'Reem Kufi';font-weight:700;font-size:210px;line-height:1">ناصر</div>
 </div>
</div>
</body></html>
